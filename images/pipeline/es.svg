<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img"
     aria-label="Diagrama técnico del flujo texto-a-SQL: una pregunta vacía o de más de 500 caracteres se rechaza antes de llamar al modelo. Si no, una llamada al modelo a temperatura 0 la clasifica como respondible o no (fuera de alcance, ambigua, idioma incorrecto o maliciosa reciben cada una su propia respuesta fija, y fuera de alcance se revisa una segunda vez antes de confiar en el veredicto). Una pregunta respondible se convierte en un embedding y se compara con las tablas por similitud coseno más un bono léxico, se arma el texto del esquema con columnas reales y metadatos del catálogo, y una llamada al modelo con razonamiento alto genera el SQL, que se envuelve en un LIMIT 200 y corre sobre una conexión de solo lectura. Cero filas o un error de SQL retroalimenta el fallo hasta un total de tres intentos; si los tres fallan, se devuelve una respuesta fija de falta de datos. Cuando llegan filas, una palabra clave de gráfico o mapa lleva a una llamada al modelo que titula el gráfico y devuelve directamente los datos del gráfico o mapa; si no, una llamada al modelo escribe la respuesta en prosa, que se devuelve junto con sus fuentes. Si el modelo principal falla con un error, cada llamada de arriba reintenta una vez con un modelo de respaldo antes de rendirse.">
  <rect x="0" y="0" width="900" height="1500" rx="16" fill="#E4F4EC" stroke="#B9CCC2" stroke-width="1.5"></rect>

  <defs>
    <marker id="arrow-l" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0D6E5F"></path>
    </marker>
  </defs>

  <g fill="none" stroke="#0D6E5F" stroke-width="1.6">
    <line x1="250" y1="78"   x2="250" y2="123" marker-end="url(#arrow-l)"></line>
    <line x1="250" y1="243"  x2="250" y2="288" marker-end="url(#arrow-l)"></line>
    <line x1="350" y1="183"  x2="508" y2="183" marker-end="url(#arrow-l)"></line>
    <line x1="250" y1="348"  x2="250" y2="393" marker-end="url(#arrow-l)"></line>
    <line x1="250" y1="513"  x2="250" y2="558" marker-end="url(#arrow-l)"></line>
    <line x1="350" y1="453"  x2="508" y2="453" marker-end="url(#arrow-l)"></line>
    <line x1="250" y1="618"  x2="250" y2="658" marker-end="url(#arrow-l)"></line>
    <line x1="250" y1="718"  x2="250" y2="763" marker-end="url(#arrow-l)"></line>
    <line x1="250" y1="843"  x2="250" y2="888" marker-end="url(#arrow-l)"></line>
    <line x1="250" y1="1008" x2="250" y2="1053" marker-end="url(#arrow-l)"></line>
    <line x1="350" y1="948"  x2="508" y2="948" marker-end="url(#arrow-l)"></line>
    <line x1="250" y1="1173" x2="250" y2="1218" marker-end="url(#arrow-l)"></line>
    <line x1="350" y1="1113" x2="508" y2="1113" marker-end="url(#arrow-l)"></line>
    <path d="M150,948 C70,948 70,803 110,803" marker-end="url(#arrow-l)"></path>
  </g>

  <g fill="#E4F4EC">
    <rect x="185" y="266" width="130" height="18" rx="4"></rect>
    <rect x="414" y="159" width="30" height="18" rx="4"></rect>
    <rect x="195" y="531" width="110" height="18" rx="4"></rect>
    <rect x="425" y="444" width="22" height="18" rx="4"></rect>
    <rect x="195" y="1021" width="110" height="18" rx="4"></rect>
    <rect x="405" y="939" width="100" height="18" rx="4"></rect>
    <rect x="234" y="1186" width="32" height="18" rx="4"></rect>
    <rect x="414" y="1104" width="30" height="18" rx="4"></rect>
    <rect x="35"  y="866" width="140" height="18" rx="4"></rect>
  </g>
  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#34393A" text-anchor="middle">
    <text x="250" y="279">Longitud válida</text>
    <text x="429" y="172">Sí</text>
    <text x="250" y="544">Respondible</text>
    <text x="436" y="457">No</text>
    <text x="250" y="1034">Encontró filas</text>
    <text x="455" y="952">No, agotado</text>
    <text x="250" y="1199">No</text>
    <text x="429" y="1117">Sí</text>
    <text x="105" y="879">reintenta, hasta 3 en total</text>
  </g>

  <rect x="110" y="22" width="280" height="56" rx="28" fill="#EEF9F3" stroke="#B9CCC2" stroke-width="1.5"></rect>
  <text x="250" y="55" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13.5" font-weight="500" fill="#34393A">Haces una pregunta</text>

  <polygon points="250,123 350,183 250,243 150,183" fill="#7ED9B8"></polygon>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#1E4438">
    <text x="250" y="178">¿Vacía o supera</text>
    <text x="250" y="194">500 caracteres?</text>
  </g>

  <rect x="110" y="288" width="280" height="60" rx="10" fill="#0D6E5F"></rect>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" fill="#EAFBF4">
    <text x="250" y="316" font-size="13" font-weight="500">Clasifica la pregunta</text>
    <text x="250" y="334" font-size="11">Llamada al modelo · temperatura 0</text>
  </g>

  <polygon points="250,393 350,453 250,513 150,453" fill="#7ED9B8"></polygon>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#1E4438">
    <text x="250" y="448">¿Es</text>
    <text x="250" y="464">respondible?</text>
  </g>

  <rect x="110" y="558" width="280" height="60" rx="10" fill="#0D6E5F"></rect>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" fill="#EAFBF4">
    <text x="250" y="586" font-size="13" font-weight="500">Encuentra tablas relevantes</text>
    <text x="250" y="604" font-size="10">embeddings + coseno + bono léxico</text>
  </g>

  <rect x="110" y="658" width="280" height="60" rx="10" fill="#0D6E5F"></rect>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" fill="#EAFBF4">
    <text x="250" y="686" font-size="13" font-weight="500">Arma el texto del esquema</text>
    <text x="250" y="704" font-size="10.5">columnas reales + metadatos del catálogo</text>
  </g>

  <rect x="110" y="763" width="280" height="80" rx="10" fill="#0D6E5F"></rect>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" fill="#EAFBF4">
    <text x="250" y="787" font-size="13" font-weight="500">Genera el SQL</text>
    <text x="250" y="805" font-size="11">Llamada al modelo · razonamiento alto</text>
    <text x="250" y="822" font-size="10.5">se envuelve: LIMIT 200 · conexión de solo lectura</text>
  </g>

  <polygon points="250,888 350,948 250,1008 150,948" fill="#7ED9B8"></polygon>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#1E4438">
    <text x="250" y="943">¿La consulta</text>
    <text x="250" y="959">devolvió filas?</text>
  </g>

  <polygon points="250,1053 350,1113 250,1173 150,1113" fill="#7ED9B8"></polygon>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#1E4438">
    <text x="250" y="1108">¿Pidieron gráfico</text>
    <text x="250" y="1124">o mapa?</text>
  </g>

  <rect x="110" y="1218" width="280" height="80" rx="14" fill="#0D6E5F"></rect>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" fill="#EAFBF4">
    <text x="250" y="1242" font-size="13" font-weight="500">Escribe la respuesta</text>
    <text x="250" y="1260" font-size="11">Llamada al modelo · temperatura 0</text>
    <text x="250" y="1278" font-size="11">→ devuelve respuesta + fuentes</text>
  </g>

  <rect x="510" y="1073" width="280" height="80" rx="14" fill="#0D6E5F"></rect>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" fill="#EAFBF4">
    <text x="650" y="1097" font-size="13" font-weight="500">Titula el gráfico/mapa</text>
    <text x="650" y="1115" font-size="11">Llamada al modelo · temperatura 0</text>
    <text x="650" y="1133" font-size="11">→ devuelve los datos del gráfico</text>
  </g>

  <rect x="510" y="148" width="280" height="70" rx="14" fill="#A94A1E"></rect>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#FFF6EF">
    <text x="650" y="178">Rechazada de inmediato</text>
    <text x="650" y="194">sin llamar al modelo</text>
  </g>

  <rect x="510" y="418" width="280" height="70" rx="14" fill="#A94A1E"></rect>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#FFF6EF">
    <text x="650" y="448">No es respondible</text>
    <text x="650" y="464">→ respuesta fija (4 casos)</text>
  </g>

  <rect x="510" y="913" width="280" height="70" rx="14" fill="#A94A1E"></rect>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#FFF6EF">
    <text x="650" y="943">Sigue vacía o con error</text>
    <text x="650" y="959">tras el 3er intento → respuesta</text>
  </g>

  <text x="450" y="1370" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" font-style="italic" fill="#5B6462">Si el modelo principal falla con un error, cada llamada de arriba reintenta una vez con un modelo de respaldo antes de rendirse.</text>

  <g font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="#34393A">
    <rect x="50" y="1440" width="24" height="14" rx="4" fill="#0D6E5F"></rect>
    <text x="84" y="1451" text-anchor="start">Un paso que da la app (puede llamar al modelo)</text>
    <polygon points="420,1440 429,1449 420,1458 411,1449" fill="#7ED9B8"></polygon>
    <text x="443" y="1451" text-anchor="start">Un punto de decisión</text>
    <rect x="590" y="1440" width="24" height="14" rx="7" fill="#A94A1E"></rect>
    <text x="624" y="1451" text-anchor="start">Sale por un camino distinto</text>
  </g>
</svg>
