<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img"
     aria-label="Technical flowchart of the text-to-SQL pipeline: a question over 500 characters or empty is rejected before any model call. Otherwise a model call at temperature 0 classifies it as answerable or not (out-of-scope, unclear, wrong language or malicious each get their own preset reply, and out-of-scope is re-checked once before being trusted). An answerable question is embedded and ranked against the tables by cosine similarity plus a keyword bonus, the matching schema text is built from live columns and catalog metadata, then a model call at high reasoning effort generates SQL, which is wrapped in a LIMIT 200 and run on a read-only connection. Zero rows or a SQL error feeds the failure back into up to three total attempts; if all three fail, a preset no-data reply is returned. Once rows come back, a chart or map keyword routes to a model call that titles the chart and returns the chart or map data directly; otherwise a model call writes the prose answer, which is returned with its sources. If the primary model errors, every model call above retries once on a fallback model before giving up.">
  <rect x="0" y="0" width="900" height="1500" rx="16" fill="#E4F4EC" stroke="#B9CCC2" stroke-width="1.5"></rect>

  <defs>
    <marker id="arrow-l" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0D6E5F"></path>
    </marker>
  </defs>

  <g fill="none" stroke="#0D6E5F" stroke-width="1.6">
    <line x1="250" y1="78"   x2="250" y2="123" marker-end="url(#arrow-l)"></line>
    <line x1="250" y1="243"  x2="250" y2="288" marker-end="url(#arrow-l)"></line>
    <line x1="350" y1="183"  x2="508" y2="183" marker-end="url(#arrow-l)"></line>
    <line x1="250" y1="348"  x2="250" y2="393" marker-end="url(#arrow-l)"></line>
    <line x1="250" y1="513"  x2="250" y2="558" marker-end="url(#arrow-l)"></line>
    <line x1="350" y1="453"  x2="508" y2="453" marker-end="url(#arrow-l)"></line>
    <line x1="250" y1="618"  x2="250" y2="658" marker-end="url(#arrow-l)"></line>
    <line x1="250" y1="718"  x2="250" y2="763" marker-end="url(#arrow-l)"></line>
    <line x1="250" y1="843"  x2="250" y2="888" marker-end="url(#arrow-l)"></line>
    <line x1="250" y1="1008" x2="250" y2="1053" marker-end="url(#arrow-l)"></line>
    <line x1="350" y1="948"  x2="508" y2="948" marker-end="url(#arrow-l)"></line>
    <line x1="250" y1="1173" x2="250" y2="1218" marker-end="url(#arrow-l)"></line>
    <line x1="350" y1="1113" x2="508" y2="1113" marker-end="url(#arrow-l)"></line>
    <path d="M150,948 C70,948 70,803 110,803" marker-end="url(#arrow-l)"></path>
  </g>

  <g fill="#E4F4EC">
    <rect x="200" y="266" width="100" height="18" rx="4"></rect>
    <rect x="414" y="159" width="32" height="18" rx="4"></rect>
    <rect x="210" y="531" width="80" height="18" rx="4"></rect>
    <rect x="413" y="444" width="34" height="18" rx="4"></rect>
    <rect x="205" y="1021" width="90" height="18" rx="4"></rect>
    <rect x="410" y="939" width="90" height="18" rx="4"></rect>
    <rect x="225" y="1186" width="40" height="18" rx="4"></rect>
    <rect x="413" y="1104" width="34" height="18" rx="4"></rect>
    <rect x="45"  y="866" width="120" height="18" rx="4"></rect>
  </g>
  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#34393A" text-anchor="middle">
    <text x="250" y="279">Valid length</text>
    <text x="430" y="172">Yes</text>
    <text x="250" y="544">Answerable</text>
    <text x="430" y="457">No</text>
    <text x="250" y="1034">Rows found</text>
    <text x="455" y="952">No, exhausted</text>
    <text x="245" y="1199">No</text>
    <text x="430" y="1117">Yes</text>
    <text x="105" y="879">retries, up to 3 total</text>
  </g>

  <rect x="110" y="22" width="280" height="56" rx="28" fill="#EEF9F3" stroke="#B9CCC2" stroke-width="1.5"></rect>
  <text x="250" y="55" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13.5" font-weight="500" fill="#34393A">You ask a question</text>

  <polygon points="250,123 350,183 250,243 150,183" fill="#7ED9B8"></polygon>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#1E4438">
    <text x="250" y="178">Empty or over</text>
    <text x="250" y="194">500 characters?</text>
  </g>

  <rect x="110" y="288" width="280" height="60" rx="10" fill="#0D6E5F"></rect>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" fill="#EAFBF4">
    <text x="250" y="316" font-size="13" font-weight="500">Classifies the question</text>
    <text x="250" y="334" font-size="11">LLM call · temperature 0</text>
  </g>

  <polygon points="250,393 350,453 250,513 150,453" fill="#7ED9B8"></polygon>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#1E4438">
    <text x="250" y="448">Is it</text>
    <text x="250" y="464">answerable?</text>
  </g>

  <rect x="110" y="558" width="280" height="60" rx="10" fill="#0D6E5F"></rect>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" fill="#EAFBF4">
    <text x="250" y="586" font-size="13" font-weight="500">Finds relevant tables</text>
    <text x="250" y="604" font-size="10.5">embeddings + cosine + keyword bonus</text>
  </g>

  <rect x="110" y="658" width="280" height="60" rx="10" fill="#0D6E5F"></rect>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" fill="#EAFBF4">
    <text x="250" y="686" font-size="13" font-weight="500">Builds schema text</text>
    <text x="250" y="704" font-size="11">live columns + catalog metadata</text>
  </g>

  <rect x="110" y="763" width="280" height="80" rx="10" fill="#0D6E5F"></rect>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" fill="#EAFBF4">
    <text x="250" y="787" font-size="13" font-weight="500">Generates SQL</text>
    <text x="250" y="805" font-size="11">LLM call · high reasoning effort</text>
    <text x="250" y="822" font-size="11">wraps: LIMIT 200 · read-only connection</text>
  </g>

  <polygon points="250,888 350,948 250,1008 150,948" fill="#7ED9B8"></polygon>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#1E4438">
    <text x="250" y="943">Query</text>
    <text x="250" y="959">returned rows?</text>
  </g>

  <polygon points="250,1053 350,1113 250,1173 150,1113" fill="#7ED9B8"></polygon>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#1E4438">
    <text x="250" y="1108">Chart or map</text>
    <text x="250" y="1124">requested?</text>
  </g>

  <rect x="110" y="1218" width="280" height="80" rx="14" fill="#0D6E5F"></rect>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" fill="#EAFBF4">
    <text x="250" y="1242" font-size="13" font-weight="500">Writes the answer</text>
    <text x="250" y="1260" font-size="11">LLM call · temperature 0</text>
    <text x="250" y="1278" font-size="11">→ returns answer + sources</text>
  </g>

  <rect x="510" y="1073" width="280" height="80" rx="14" fill="#0D6E5F"></rect>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" fill="#EAFBF4">
    <text x="650" y="1097" font-size="13" font-weight="500">Titles the chart/map</text>
    <text x="650" y="1115" font-size="11">LLM call · temperature 0</text>
    <text x="650" y="1133" font-size="11">→ returns chart/map data</text>
  </g>

  <rect x="510" y="148" width="280" height="70" rx="14" fill="#A94A1E"></rect>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#FFF6EF">
    <text x="650" y="178">Rejected outright</text>
    <text x="650" y="194">no model call</text>
  </g>

  <rect x="510" y="418" width="280" height="70" rx="14" fill="#A94A1E"></rect>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#FFF6EF">
    <text x="650" y="448">Not answerable</text>
    <text x="650" y="464">→ preset reply (4 kinds)</text>
  </g>

  <rect x="510" y="913" width="280" height="70" rx="14" fill="#A94A1E"></rect>
  <g text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#FFF6EF">
    <text x="650" y="943">Still empty/erroring</text>
    <text x="650" y="959">after 3rd try → reply</text>
  </g>

  <text x="450" y="1370" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" font-style="italic" fill="#5B6462">If the primary model errors, every model call above retries once on a fallback model before giving up.</text>

  <g font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="#34393A">
    <rect x="50" y="1440" width="24" height="14" rx="4" fill="#0D6E5F"></rect>
    <text x="84" y="1451" text-anchor="start">A step the app takes (may call the model)</text>
    <polygon points="400,1440 409,1449 400,1458 391,1449" fill="#7ED9B8"></polygon>
    <text x="423" y="1451" text-anchor="start">A decision point</text>
    <rect x="560" y="1440" width="24" height="14" rx="7" fill="#A94A1E"></rect>
    <text x="594" y="1451" text-anchor="start">Exits down a different path</text>
  </g>
</svg>
